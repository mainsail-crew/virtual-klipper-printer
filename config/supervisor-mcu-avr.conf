; MCU_TYPE=avr: Klipper AVR firmware (atmega644p) running in simulavr
[program:simulavr]
command=bash -c 'sleep 10 && /home/printer/klipper/scripts/avrsim.py -m atmega644p -s 20000000 -b 250000 /home/printer/klipper/out_avr/klipper.elf'
environment=PYTHONPATH=/home/printer/simulavr/build/pysimulavr/
user=printer
process_name=simulavr
directory=/home/printer
autostart=true
autorestart=true
redirect_stderr=true
