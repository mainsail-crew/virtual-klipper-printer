[heater_bed]
heater_pin: BED_HEATER
sensor_pin: BED_TEMP
sensor_type: bed_sensor
control: watermark
min_temp: 0
max_temp: 130

[gcode_macro M140]
rename_existing: M140.1
gcode:
  M117 M140 called with {rawparams}

[gcode_macro M190]
rename_existing: M190.1
gcode:
  M117 M190 called with {rawparams}
