[adc_temperature heater_bed_adc]
temperature1: 0
voltage1: 0
temperature2: 500
voltage2: 3.3

[heater_bed]
heater_pin: gpiochip0/gpio0
sensor_pin: analog0
sensor_type: heater_bed_adc
adc_voltage: 3.3
control: watermark
min_temp: 0
max_temp: 130

[gcode_macro M140]
rename_existing: M140.1
gcode:
  M117 M140 called with {rawparams}

[gcode_macro M190]
rename_existing: M190.1
gcode:
  M117 M190 called with {rawparams}
