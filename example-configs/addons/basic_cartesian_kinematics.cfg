[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 100
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: gpiochip1/gpio0
dir_pin: gpiochip1/gpio1
enable_pin: gpiochip1/gpio2
endstop_pin: ^gpiochip1/gpio3

microsteps: 1
rotation_distance: 40
position_endstop: 0
position_max: 300
position_min: -15
homing_speed: 50
homing_retract_dist: 0

[stepper_y]
step_pin: gpiochip2/gpio0
dir_pin: gpiochip2/gpio1
enable_pin: gpiochip2/gpio2
endstop_pin: ^gpiochip2/gpio3

microsteps: 1
rotation_distance: 40
position_endstop: 0
position_max: 300
position_min: -15
homing_speed: 50
homing_retract_dist: 0

[stepper_z]
step_pin: gpiochip3/gpio0
dir_pin: gpiochip3/gpio1
enable_pin: gpiochip3/gpio2
endstop_pin: ^gpiochip3/gpio3

microsteps: 1
rotation_distance: 40
position_endstop: 0.0
position_max: 250
position_min: -2
homing_retract_dist: 0
