[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 100
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: X_STEP
dir_pin: X_DIR
enable_pin: X_ENABLE
endstop_pin: ^X_STOP

microsteps: 1
rotation_distance: 40
position_endstop: 0
position_max: 300
position_min: -15
homing_speed: 50
homing_retract_dist: 0

[stepper_y]
step_pin: Y_STEP
dir_pin: Y_DIR
enable_pin: Y_ENABLE
endstop_pin: ^Y_STOP

microsteps: 1
rotation_distance: 40
position_endstop: 0
position_max: 300
position_min: -15
homing_speed: 50
homing_retract_dist: 0

[stepper_z]
step_pin: Z_STEP
dir_pin: Z_DIR
enable_pin: Z_ENABLE
endstop_pin: ^Z_STOP

microsteps: 1
rotation_distance: 40
position_endstop: 0.0
position_max: 250
position_min: -2
homing_retract_dist: 0
