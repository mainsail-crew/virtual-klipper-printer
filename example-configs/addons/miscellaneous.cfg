[fan]
pin: FAN_PART
off_below: 0.2

[heater_fan heater_fan]
pin: FAN_HEATER
off_below: 0.0
shutdown_speed: 1.0
max_power: 1.0

[controller_fan controller_fan]
pin: FAN_CONTROLLER
off_below: 0.2
shutdown_speed: 1.0
max_power: 1.0

[filament_motion_sensor runout_sensor]
switch_pin: FILAMENT_SENSOR
detection_length: 1.0
extruder: extruder
pause_on_runout: FALSE
runout_gcode:
  M117 Runout sensor reports: Runout G-Code
insert_gcode:
  M117 Runout sensor reports: Insert G-Code

[output_pin output_pin]
pin: OUTPUT_PIN
pwm: false
shutdown_value: 0
value: 1
