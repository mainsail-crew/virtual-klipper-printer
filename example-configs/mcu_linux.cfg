# Klipper Linux MCU (MCU_TYPE=linux), the hardware is simulated by printer_simulator.
# See PINS.md for the pin mapping.

[mcu]
serial: /tmp/klipper_host_mcu

############################################
###   DO NOT CHANGE PIN ASSIGNMENTS !!!  ###
############################################
# Basic configurations (safe / required to use)
[include addons-linux/basic_cartesian_kinematics.cfg]
[include addons-linux/basic_macros.cfg]

# Extruder configuration (only one config allowed at a time)
[include addons-linux/single_extruder.cfg]
#[include addons-linux/dual_extruder.cfg]
#[include addons-linux/dual_extruder_stepper.cfg]

# Other temperature sensors (only one config allowed at a time)
[include addons-linux/heater_bed.cfg]
#[include addons-linux/temp_sensors.cfg]

# Miscellaneous (only one active config allowed at a time)
[include addons-linux/miscellaneous.cfg] # [fan], [heater_fan], [controller_fan], [filament_runout_sensor], [output_pin]
#[include addons-linux/led_neopixel.cfg] # [neopixel], [led]
