# Klipper Linux MCU (MCU_TYPE=linux), the hardware is simulated by printer_simulator.
# The addons only use the aliases below, see PINS.md for the simulator wiring.

[mcu]
serial: /tmp/klipper_host_mcu

[board_pins]
aliases:
    # Steppers and endstops
    X_STEP=gpiochip1/gpio0, X_DIR=gpiochip1/gpio1, X_ENABLE=gpiochip1/gpio2, X_STOP=gpiochip1/gpio3,
    Y_STEP=gpiochip2/gpio0, Y_DIR=gpiochip2/gpio1, Y_ENABLE=gpiochip2/gpio2, Y_STOP=gpiochip2/gpio3,
    Z_STEP=gpiochip3/gpio0, Z_DIR=gpiochip3/gpio1, Z_ENABLE=gpiochip3/gpio2, Z_STOP=gpiochip3/gpio3,
    # Extruders
    E0_STEP=gpiochip4/gpio0, E0_DIR=gpiochip4/gpio1, E0_ENABLE=gpiochip4/gpio2,
    E0_HEATER=gpiochip4/gpio3, E0_TEMP=analog1,
    E1_STEP=gpiochip5/gpio0, E1_DIR=gpiochip5/gpio1, E1_ENABLE=gpiochip5/gpio2,
    E1_HEATER=gpiochip5/gpio3, E1_TEMP=analog2,
    # Heater bed
    BED_HEATER=gpiochip0/gpio0, BED_TEMP=analog0,
    # Fans, sensors and outputs
    FAN_PART=gpiochip6/gpio0, FAN_HEATER=gpiochip6/gpio1, FAN_CONTROLLER=gpiochip6/gpio2,
    FILAMENT_SENSOR=gpiochip6/gpio3, OUTPUT_PIN=gpiochip6/gpio4,
    TEMP_SENSOR=analog3,
    CHAMBER_FAN=gpiochip0/gpio6, CHAMBER_TEMP=analog4, CHAMBER_TACH=gpiochip0/gpio7,
    # LEDs
    NEOPIXEL=gpiochip0/gpio1, LED_RED=gpiochip0/gpio2, LED_GREEN=gpiochip0/gpio3, LED_BLUE=gpiochip0/gpio4

# printer_simulator reports the temperature as a linear voltage (0 V = 0 °C, full scale = 500 °C)
[adc_temperature extruder_sensor]
temperature1: 0
voltage1: 0
temperature2: 500
voltage2: 5.0

[adc_temperature bed_sensor]
temperature1: 0
voltage1: 0
temperature2: 500
voltage2: 5.0
