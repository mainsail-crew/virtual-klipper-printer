# Klipper AVR firmware (atmega644p) in simulavr (MCU_TYPE=avr).
# The addons only use the aliases below.

[mcu]
serial: /tmp/pseudoserial
restart_method: arduino

# PD0/PD1 are used by the serial port. Pins that appear twice are only used by
# addons that can't be active at the same time.
[board_pins]
aliases:
    # Steppers and endstops
    X_STEP=PD7, X_DIR=PC5, X_ENABLE=PD6, X_STOP=PC2,
    Y_STEP=PC6, Y_DIR=PC7, Y_ENABLE=PA0, Y_STOP=PC3,
    Z_STEP=PB3, Z_DIR=PB2, Z_ENABLE=PA5, Z_STOP=PC4,
    # Extruders
    E0_STEP=PB1, E0_DIR=PB0, E0_ENABLE=PA2, E0_HEATER=PD5, E0_TEMP=PA7,
    E1_STEP=PD3, E1_DIR=PD2, E1_ENABLE=PA3, E1_HEATER=PB7, E1_TEMP=PA1,
    # Heater bed
    BED_HEATER=PD4, BED_TEMP=PA6,
    # Fans, sensors and outputs
    FAN_PART=PB4, FAN_HEATER=PB5, FAN_CONTROLLER=PB6, FILAMENT_SENSOR=PC1, OUTPUT_PIN=PC0,
    TEMP_SENSOR=PA4,
    CHAMBER_FAN=PD2, CHAMBER_TEMP=PA6, CHAMBER_TACH=PD3,
    # LEDs
    NEOPIXEL=PC0, LED_RED=PB4, LED_GREEN=PB5, LED_BLUE=PB6

# EPCOS 100K B57560G104F, the thermistor of the simulavr setup
[thermistor extruder_sensor]
temperature1: 25
resistance1: 100000
beta: 4092

[thermistor bed_sensor]
temperature1: 25
resistance1: 100000
beta: 4092
