# Klipper AVR firmware in simulavr (MCU_TYPE=avr).

# AVR atmega644p Pins:
# PA0, PA1, PA2, PA3, PA4, PA5, PA6, PA7
# PB0, PB1, PB2, PB3, PB4, PB5, PB6, PB7
# PC0, PC1, PC2, PC3, PC4, PC5, PC6, PC7
# PD0, PD1, PD2, PD3, PD4, PD5, PD6, PD7

[mcu]
serial: /tmp/pseudoserial
restart_method: arduino

############################################
###   DO NOT CHANGE PIN ASSIGNMENTS !!!  ###
############################################
# Basic configurations (safe / required to use)
[include addons-avr/basic_cartesian_kinematics.cfg]
[include addons-avr/basic_macros.cfg]

# Extruder configuration (only one config allowed at a time)
[include addons-avr/single_extruder.cfg]
#[include addons-avr/dual_extruder.cfg]
#[include addons-avr/dual_extruder_stepper.cfg]

# Other temperature sensors (only one config allowed at a time)
[include addons-avr/heater_bed.cfg]
#[include addons-avr/temp_sensors.cfg]

# Miscellaneous (only one active config allowed at a time)
[include addons-avr/miscellaneous.cfg] # [fan], [heater_fan], [controller_fan], [filament_runout_sensor], [output_pin]
#[include addons-avr/led_neopixel.cfg] # [neopixel], [led]
