[temperature_sensor endstop]
sensor_type: Generic 3950
sensor_pin: gpiochip0/gpio5
min_temp: -255
max_temp: 256
gcode_id: E

# [temperature_fan chamber_heater] is not currently supported by the simulator.
# It requires an analog3 pin which has no registered simulator component.
# Uncomment and implement a TemperatureFan simulator class to enable this.
#
# [temperature_fan chamber_heater]
# pin: gpiochip0/gpio6
# max_power: 1.0
# shutdown_speed: 0.0
# cycle_time: 0.0005     #2 kHz PWM signal
# hardware_pwm: False
# kick_start_time: 0
# sensor_type: ATC Semitec 104GT-2
# sensor_pin: analog3
# min_temp: -255
# max_temp: 256
# target_temp: 0
# max_speed: 0.7
# min_speed: 0.1
# control: pid
# pid_Kp: 2.0     ;40
# pid_Ki: 5.0     ;0.2
# pid_Kd: 0.5     ;0.1
# pid_deriv_time: 2.0
# gcode_id: C
# tachometer_pin: gpiochip0/gpio7
# tachometer_ppr: 2