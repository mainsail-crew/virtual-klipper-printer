repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff-check
        args: [--fix, --config=printer_simulator/pyproject.toml]
        files: ^printer_simulator/
      - id: ruff-format
        args: [--config=printer_simulator/pyproject.toml]
        files: ^printer_simulator/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: [--config-file=printer_simulator/pyproject.toml]
        files: ^printer_simulator/
